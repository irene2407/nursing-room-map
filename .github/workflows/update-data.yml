name: 수유실 자료 업데이트

on:
  workflow_dispatch: {}          # Actions 화면에서 직접 실행
  schedule:
    - cron: "17 18 1 * *"        # 매달 2일 새벽 3시 17분 (한국 시간)

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 자료 받기
        env:
          SOOYUSIL_KEY: ${{ secrets.SOOYUSIL_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python3 scripts/update_data.py

      - name: 바뀐 자료 올리기
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 자료가 없어요"
          else
            git commit -m "수유실 자료 자동 업데이트 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
